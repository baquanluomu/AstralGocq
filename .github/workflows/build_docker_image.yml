name: Build and Push Docker Image

on:
  push:
    branches: [ "dev" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      custom_version:
        description: '版本号 (例如 v1.3.1-pre-8)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        run: |
          if [ -n "${{ inputs.custom_version }}" ]; then
            echo "TAGS=luomubiji/astralgocq:${{ inputs.custom_version }},luomubiji/astralgocq:latest" >> $GITHUB_OUTPUT
          elif [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "TAGS=luomubiji/astralgocq:$VERSION,luomubiji/astralgocq:latest" >> $GITHUB_OUTPUT
          else
            echo "TAGS=luomubiji/astralgocq:latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./custom-docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le,linux/s390x
          push: true
          tags: ${{ steps.tags.outputs.TAGS }}
